<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10253f"><title>LA Mart Work Orders</title>
  <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css?v=20260828-build-tag"><link rel="stylesheet" href="/assets/work-orders.css"><script src="/assets/app.js?v=20260828-build-tag" defer></script>
</head>
<body>
<section id="login-view" class="auth-shell">
  <form id="login-form" class="card auth-card">
    <img src="/assets/lamart-logo.svg" alt="LA Mart"><span class="eyebrow">OPERATIONS</span><h1>Sign in</h1>
    <label>Username or email<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="error" role="alert"></p><button type="submit">Sign in</button>
  </form>
</section>
<div id="app-view" hidden>
  <header>
    <div class="brand"><div class="brand-logo-line"><img src="/assets/lamart-logo.svg" alt="LA Mart"><span class="build-tag">20260828-build-tag</span></div><div><span class="eyebrow">OPERATIONS</span><h1>Work orders</h1></div></div>
    <div class="account"><span id="account-name"></span><button id="menu-button" class="icon-button" aria-label="Account menu" aria-expanded="false">&#8942;</button>
      <div id="account-menu" class="menu" hidden><button id="manage-users" hidden>Manage Users</button><button id="profile-button">Profile</button><button id="logout-button">Logout</button></div>
    </div>
  </header>
  <main>
    <section class="metrics"><article><span>Total</span><strong id="total">—</strong></article><article><span>Urgent</span><strong id="urgent">—</strong></article><article><span>In progress</span><strong id="progress">—</strong></article></section>
    <section class="workspace">
      <div class="queue card"><div class="toolbar"><div><h2>Active queue</h2><p id="message"></p></div><input id="search" type="search" placeholder="Search number, title, location"><button id="refresh" class="secondary">Refresh</button></div>
        <div id="filters" class="filters"><button data-filter="Me">Me</button><button data-filter="All">All</button><button data-filter="New" class="active">New</button><button data-filter="Open">Open/In Progress</button><button data-filter="Completed">Completed</button><button data-filter="Closed">Closed/Cancelled</button></div>
        <div class="table-wrap"><table><thead><tr><th>Number</th><th>Work</th><th>Priority</th><th>Status</th><th>Owner</th></tr></thead><tbody id="orders"></tbody></table></div>
      </div>
      <form id="create-form" class="card intake"><div class="form-title-row"><div><span class="eyebrow">INTAKE</span><h2>New work order</h2></div><button type="button" id="close-create" class="secondary mobile-only">Back</button></div>
        <label>Store<select name="storeNumber" id="store"></select></label><label>Title<input name="title" required maxlength="120"></label><label>Description<textarea name="description" required maxlength="2000"></textarea></label>
        <label>Requested by<input id="requested-by" readonly></label><label>Location<input name="location" required maxlength="160"></label>
        <label>Priority<select name="priority"><option>Normal</option><option>Low</option><option>High</option><option>Emergency</option></select></label><label>Assigned to<select name="assignedTo" id="assigned-to"><option value="">Unassigned</option></select></label>
        <label>Pictures or videos<input name="attachments" type="file" accept="image/*,video/*" multiple></label><button type="submit">Create work order</button>
      </form>
    </section>
  </main>
  <button type="button" id="mobile-create-toggle" class="mobile-create-button mobile-only">New Work Order</button>
</div>
<dialog id="profile-dialog"><form id="profile-form" method="dialog"><h2>Profile</h2><p id="profile-meta"></p><label>Display name<input name="displayName" required maxlength="120"></label><label>Email<input name="email" type="email" maxlength="254"></label><p id="profile-error" class="error"></p><div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button value="default" type="submit">Save</button></div></form></dialog>
<dialog id="work-order-dialog" class="detail-dialog">
  <div class="detail-shell">
    <button type="button" id="close-work-order" class="secondary">Back</button>
    <div id="work-order-detail"></div>
    <p id="work-order-error" class="error" role="alert"></p>
  </div>
</dialog>
</body></html>
