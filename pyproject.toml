[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lamworkorder"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.9,<7"]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
lamworkorder-api = "lamworkorder.__main__:main"
lamworkorder-desktop = "lamworkorder_desktop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/lamworkorder", "desktop/lamworkorder_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

